<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16213e">
<title>C&OPZ v4</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header><h1>🎂 C&OPZ <span id="badge"></span></h1><button id="btn-settings">⚙️</button></header>
  <nav id="tabs">
    <button data-tab="today" class="active">Oggi</button>
    <button data-tab="yesterday">Anticipati</button>
    <button data-tab="tomorrow">Domani</button>
  </nav>
  <main id="main"></main>
</div>

<!-- Settings Modal -->
<div id="modal" class="hidden">
  <div class="modal-box">
    <h2>Impostazioni</h2>
    <label>Il tuo nome (firma):<input id="uf-name" placeholder="Mario"></label>
    <label>Qualifica:<input id="uf-role" placeholder="Amico"></label>
    <label>Codifica CSV:
      <select id="csv-enc"><option value="utf-8">UTF-8</option><option value="iso-8859-1">ISO-8859-1 (Windows)</option></select>
    </label>
    <label class="chk-row"><input type="checkbox" id="chk-comm"> <span>Mostra commemorativi</span></label>
    <h3>📁 File</h3>
    <label>Rubrica VCF:<input type="file" id="file-vcf" accept=".vcf,.vcard"></label>
    <label>Onomastici CSV:<input type="file" id="file-csv" accept=".csv"></label>
    <h3>✏️ Messaggi</h3>
    <details id="det-bday"><summary>Compleanno (3 varianti)</summary>
      <div id="vars-bday"></div>
    </details>
    <details id="det-onom"><summary>Onomastico (5 varianti)</summary>
      <div id="vars-onom"></div>
    </details>
    <details id="det-comm"><summary>Commemorativo</summary>
      <div id="vars-comm"></div>
    </details>
    <div class="btns"><button id="btn-save">💾 Salva</button><button id="btn-close">Chiudi</button></div>
  </div>
</div>

<script src="js/parser.js"></script>
<script src="js/matcher.js"></script>
<script src="js/messages.js"></script>
<script src="js/app.js"></script>
</body>
</html>
